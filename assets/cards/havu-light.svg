<clipPath id="c"><rect width="440" height="236" rx="18"/></clipPath>
</defs>
<g class="in">
<g clip-path="url(#c)">
<rect width="440" height="236" fill="#FFFFFF"/>
<rect width="440" height="236" fill="url(#g)"/>
