<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-label="LokTathya — Makes India's public and government information easier to find, check and understand.">
<title>LokTathya — Makes India's public and government information easier to find, check and understand.</title>
<defs><clipPath id="c"><rect width="480" height="300" rx="20"/></clipPath></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.fade{opacity:0;animation:fade .7s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(2.6);opacity:0}}
.cy{opacity:0;animation:cy 10s infinite}
@keyframes cy{0%{opacity:0;transform:translateY(10px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-10px)}}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{to{transform:scale(1)}}
.float{animation:float 7s ease-in-out infinite}
.float2{animation:float 9s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,12px)}}
</style>
<g clip-path="url(#c)"><rect width="480" height="300" fill="#FFFFFF"/>
<g class="float"><circle cx="470" cy="10" r="70" fill="#FFFBEB"/></g>
<rect width="480" height="4" fill="#D97706" class="bar"/></g>
<rect x=".5" y=".5" width="479" height="299" rx="20" fill="none" stroke="#E5E7EB"/>
<g class="fade">
<rect x="26" y="24" width="136.2" height="24" rx="12" fill="#F0F9FF" stroke="#BAE6FD"/>
<circle cx="40" cy="36" r="4" fill="#0284C7" class="pulse"/>
<text x="51" y="40" class="mono" font-size="11" font-weight="700" fill="#0284C7" letter-spacing="1">IN DEVELOPMENT</text>
<text x="454" y="40" text-anchor="end" font-size="13" font-weight="600" fill="#6B7280">Civic tech</text>
<text x="25" y="90" font-size="29" font-weight="800" fill="#111827" letter-spacing="-.5">LokTathya</text>
<text x="26" y="120" font-size="15" fill="#4B5563">Makes India's public and government information</text>
<text x="26" y="141" font-size="15" fill="#4B5563">easier to find, check and understand.</text>
</g><g class="fade" style="animation-delay:0.25s">
<text x="27" y="178" font-size="14" font-weight="800" fill="#D97706">✓</text>
<text x="46" y="178" font-size="14" fill="#111827">AI answers grounded in official sources</text>
</g><g class="fade" style="animation-delay:0.37s">
<text x="27" y="202" font-size="14" font-weight="800" fill="#D97706">✓</text>
<text x="46" y="202" font-size="14" fill="#111827">Location-aware data on maps</text>
</g><g class="fade" style="animation-delay:0.49s">
<text x="27" y="226" font-size="14" font-weight="800" fill="#D97706">✓</text>
<text x="46" y="226" font-size="14" fill="#111827">76 automated checks on every change</text>
</g><g class="fade" style="animation-delay:.7s">
<line x1="26" y1="244" x2="454" y2="244" stroke="#F1F5F9" stroke-width="1.5"/>
<text x="26" y="273" class="mono" font-size="11.5" fill="#6B7280">FastAPI · Next.js · PostGIS · RAG</text>
<text x="454" y="273" text-anchor="end" font-size="13.5" font-weight="700" fill="#D97706">View on GitHub →</text>
</g>
