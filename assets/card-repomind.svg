<svg xmlns="http://www.w3.org/2000/svg" width="480" height="252" viewBox="0 0 480 252" role="img" aria-label="RepoMind — Ask any GitHub repository a question — answers come back with file &amp; line citations.">
<title>RepoMind — Ask any GitHub repository a question — answers come back with file &amp; line citations.</title>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<radialGradient id="glow" cx="100%" cy="0%" r="75%"><stop offset="0" stop-color="#A78BFA" stop-opacity=".16"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="480" height="252" rx="16"/></clipPath></defs>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
.fade{opacity:0;animation:fade .6s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.show{opacity:0;animation:show .5s ease-out forwards}
@keyframes show{to{opacity:1}}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(2.8);opacity:0}}
.cursor{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2.4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
</style>
<g clip-path="url(#c)">
<rect width="480" height="252" fill="#0E1420"/><rect width="480" height="252" fill="url(#glow)"/>
<rect width="480" height="3" fill="url(#g)" class="bar"/>
</g>
<rect x=".5" y=".5" width="479" height="251" rx="16" fill="none" stroke="#1F2937"/>
<g class="fade">
<circle cx="31" cy="33" r="4.5" fill="#22D3EE" class="pulse"/>
<text x="43" y="37.5" class="mono" font-size="11" fill="#22D3EE" letter-spacing="1.3">ACTIVE</text>
<text x="454" y="37.5" class="mono" font-size="11" fill="#6B7280" text-anchor="end">rag · code intelligence</text>
<text x="25" y="78" class="sans" font-size="27" font-weight="800" fill="#F9FAFB" letter-spacing="-.5">RepoMind</text>
<text x="26" y="104" class="sans" font-size="14" fill="#9CA3AF">Ask any GitHub repository a question —</text>
<text x="26" y="123" class="sans" font-size="14" fill="#9CA3AF">answers come back with file &amp; line citations.</text>
<line x1="26" y1="143" x2="454" y2="143" stroke="#1F2937"/>
</g>
<g class="fade" style="animation-delay:.25s"><text x="26" y="178" class="sans" font-size="26" font-weight="800" fill="url(#g)">AST</text><text x="26" y="197" class="mono" font-size="10" fill="#6B7280" letter-spacing=".8">CODE CHUNKING</text><text x="174" y="178" class="sans" font-size="26" font-weight="800" fill="url(#g)">9</text><text x="174" y="197" class="mono" font-size="10" fill="#6B7280" letter-spacing=".8">LLM PROVIDERS</text><text x="322" y="178" class="sans" font-size="26" font-weight="800" fill="url(#g)">file:line</text><text x="322" y="197" class="mono" font-size="10" fill="#6B7280" letter-spacing=".8">CITATIONS</text></g>
<g class="fade" style="animation-delay:.45s"><rect x="26.0" y="212" width="82.6" height="24" rx="12.0" fill="#A78BFA" fill-opacity=".10" stroke="#A78BFA" stroke-opacity=".38"/>
<text x="36.0" y="228.1" class="mono" font-size="11.5" fill="#E5E7EB">LangGraph</text>
<rect x="116.6" y="212" width="61.7" height="24" rx="12.0" fill="#A78BFA" fill-opacity=".10" stroke="#A78BFA" stroke-opacity=".38"/>
<text x="126.6" y="228.1" class="mono" font-size="11.5" fill="#E5E7EB">Qdrant</text>
<rect x="186.2" y="212" width="68.7" height="24" rx="12.0" fill="#A78BFA" fill-opacity=".10" stroke="#A78BFA" stroke-opacity=".38"/>
<text x="196.2" y="228.1" class="mono" font-size="11.5" fill="#E5E7EB">FastAPI</text>
<rect x="262.9" y="212" width="54.8" height="24" rx="12.0" fill="#A78BFA" fill-opacity=".10" stroke="#A78BFA" stroke-opacity=".38"/>
<text x="272.9" y="228.1" class="mono" font-size="11.5" fill="#E5E7EB">React</text>
<rect x="325.6" y="212" width="89.5" height="24" rx="12.0" fill="#A78BFA" fill-opacity=".10" stroke="#A78BFA" stroke-opacity=".38"/>
<text x="335.6" y="228.1" class="mono" font-size="11.5" fill="#E5E7EB">TypeScript</text></g>
</svg>
