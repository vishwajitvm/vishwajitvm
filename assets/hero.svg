<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="Vishwajit Mall — Backend &amp; AI Engineer. Open to freelance &amp; contract work.">
<title>Vishwajit Mall — Backend &amp; AI Engineer. Open to freelance &amp; contract work.</title>
<defs>
