<svg xmlns="http://www.w3.org/2000/svg" width="480" height="252" viewBox="0 0 480 252" role="img" aria-label="Hopline — Encrypted peer-to-peer file transfer — in the browser, on desktop and from the CLI.">
<title>Hopline — Encrypted peer-to-peer file transfer — in the browser, on desktop and from the CLI.</title>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
<radialGradient id="glow" cx="100%" cy="0%" r="75%"><stop offset="0" stop-color="#22D3EE" stop-opacity=".16"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="480" height="252" rx="16"/></clipPath></defs>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
.fade{opacity:0;animation:fade .6s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.show{opacity:0;animation:show .5s ease-out forwards}
@keyframes show{to{opacity:1}}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(2.8);opacity:0}}
.cursor{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2.4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
</style>
<g clip-path="url(#c)">
<rect width="480" height="252" fill="#0E1420"/><rect width="480" height="252" fill="url(#glow)"/>
<rect width="480" height="3" fill="url(#g)" class="bar"/>
</g>
<rect x=".5" y=".5" width="479" height="251" rx="16" fill="none" stroke="#1F2937"/>
<g class="fade">
<circle cx="31" cy="33" r="4.5" fill="#34D399" class="pulse"/>
<text x="43" y="37.5" class="mono" font-size="11" fill="#34D399" letter-spacing="1.3">LIVE</text>
<text x="454" y="37.5" class="mono" font-size="11" fill="#6B7280" text-anchor="end">p2p · e2e crypto</text>
<text x="25" y="78" class="sans" font-size="27" font-weight="800" fill="#F9FAFB" letter-spacing="-.5">Hopline</text>
<text x="26" y="104" class="sans" font-size="14" fill="#9CA3AF">Encrypted peer-to-peer file transfer —</text>
<text x="26" y="123" class="sans" font-size="14" fill="#9CA3AF">in the browser, on desktop and from the CLI.</text>
<line x1="26" y1="143" x2="454" y2="143" stroke="#1F2937"/>
</g>
<g class="fade" style="animation-delay:.25s"><text x="26" y="178" class="sans" font-size="26" font-weight="800" fill="url(#g)">10 GiB</text><text x="26" y="197" class="mono" font-size="10" fill="#6B7280" letter-spacing=".8">IN 56.8 SECONDS</text><text x="174" y="178" class="sans" font-size="26" font-weight="800" fill="url(#g)">3</text><text x="174" y="197" class="mono" font-size="10" fill="#6B7280" letter-spacing=".8">PLATFORMS</text><text x="322" y="178" class="sans" font-size="26" font-weight="800" fill="url(#g)">AES-256</text><text x="322" y="197" class="mono" font-size="10" fill="#6B7280" letter-spacing=".8">GCM · CPACE PAKE</text></g>
<g class="fade" style="animation-delay:.45s"><rect x="26.0" y="212" width="61.7" height="24" rx="12.0" fill="#22D3EE" fill-opacity=".10" stroke="#22D3EE" stroke-opacity=".38"/>
<text x="36.0" y="228.1" class="mono" font-size="11.5" fill="#E5E7EB">WebRTC</text>
<rect x="95.7" y="212" width="68.7" height="24" rx="12.0" fill="#22D3EE" fill-opacity=".10" stroke="#22D3EE" stroke-opacity=".38"/>
<text x="105.7" y="228.1" class="mono" font-size="11.5" fill="#E5E7EB">Node.js</text>
<rect x="172.4" y="212" width="75.6" height="24" rx="12.0" fill="#22D3EE" fill-opacity=".10" stroke="#22D3EE" stroke-opacity=".38"/>
<text x="182.4" y="228.1" class="mono" font-size="11.5" fill="#E5E7EB">React 19</text>
<rect x="256.0" y="212" width="75.6" height="24" rx="12.0" fill="#22D3EE" fill-opacity=".10" stroke="#22D3EE" stroke-opacity=".38"/>
<text x="266.0" y="228.1" class="mono" font-size="11.5" fill="#E5E7EB">Electron</text>
<rect x="339.6" y="212" width="61.7" height="24" rx="12.0" fill="#22D3EE" fill-opacity=".10" stroke="#22D3EE" stroke-opacity=".38"/>
<text x="349.6" y="228.1" class="mono" font-size="11.5" fill="#E5E7EB">Docker</text></g>
</svg>
