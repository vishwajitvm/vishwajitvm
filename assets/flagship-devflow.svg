<radialGradient id="glow" cx="100%" cy="0%" r="70%"><stop offset="0" stop-color="#F472B6" stop-opacity=".16"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#FBBF24" stop-opacity=".1"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></radialGradient>
