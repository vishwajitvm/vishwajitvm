<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-label="DevFlow-AI — self-hosted AI code review, auto-fix and CI/CD for GitHub &amp; GitLab">
<title>DevFlow-AI — self-hosted AI code review, auto-fix and CI/CD for GitHub &amp; GitLab</title>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
