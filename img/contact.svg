<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Have a project in mind? Email vishwajitmall50@gmail.com — available for freelance and contract work, remote.">
<title>Have a project in mind? Email vishwajitmall50@gmail.com — available for freelance and contract work, remote.</title>
<defs><clipPath id="cc"><rect width="1000" height="300" rx="24"/></clipPath><linearGradient id="mail" x1="0" x2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#DB2777"/></linearGradient></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.fade{opacity:0;animation:fade .7s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(2.6);opacity:0}}
.cy{opacity:0;animation:cy 10s infinite}
@keyframes cy{0%{opacity:0;transform:translateY(10px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-10px)}}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{to{transform:scale(1)}}
.float{animation:float 7s ease-in-out infinite}
.float2{animation:float 9s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,12px)}}
</style>
<g clip-path="url(#cc)"><rect width="1000" height="300" fill="#FFFFFF"/><g class="float"><circle cx="40" cy="300" r="110" fill="#EEF2FF"/></g><g class="float2"><circle cx="520" cy="0" r="70" fill="#FDF2F8"/></g></g><rect x=".5" y=".5" width="999" height="299" rx="24" fill="none" stroke="#E5E7EB"/><g class="fade">
<circle cx="54" cy="58" r="5" fill="#10B981"/><circle cx="54" cy="58" r="5" fill="none" stroke="#10B981" stroke-width="1.5" class="ring"/>
<text x="68" y="62.5" class="mono" font-size="12" font-weight="700" fill="#047857" letter-spacing="1.5">LET'S WORK TOGETHER</text>
<text x="46" y="114" font-size="38" font-weight="800" fill="#111827" letter-spacing="-.8">Have a project in mind?</text>
<text x="48" y="152" font-size="17" fill="#4B5563">I'm available for freelance and contract work —</text>
<text x="48" y="176" font-size="17" fill="#4B5563">remote, with teams anywhere in the world.</text>
</g>
<g class="fade" style="animation-delay:.3s">
<text x="48" y="228" font-size="24" font-weight="800" fill="url(#mail)">✉️  vishwajitmall50@gmail.com</text>
<text x="48" y="260" font-size="13.5" fill="#6B7280">New Delhi, India · IST (UTC+5:30)</text>
</g>
<g class="fade" style="animation-delay:.2s">
<rect x="604" y="40" width="356" height="220" rx="18" fill="#F9FAFB" stroke="#E5E7EB"/>
<text x="628" y="72" class="mono" font-size="11" fill="#6B7280" letter-spacing="1.5">HOW WE'D WORK</text>
</g><g class="fade" style="animation-delay:0.40s">
<circle cx="644" cy="112" r="15" fill="#EEF2FF" stroke="#C7D2FE"/>
<text x="644" y="117" text-anchor="middle" font-size="14" font-weight="800" fill="#4F46E5">1</text>
<text x="672" y="110" font-size="15.5" font-weight="700" fill="#111827">Tell me about your idea</text>
<text x="672" y="129" font-size="13" fill="#6B7280">a short email is enough</text>
</g><g class="fade" style="animation-delay:0.60s">
<circle cx="644" cy="166" r="15" fill="#FDF2F8" stroke="#FBCFE8"/>
<text x="644" y="171" text-anchor="middle" font-size="14" font-weight="800" fill="#DB2777">2</text>
<text x="672" y="164" font-size="15.5" font-weight="700" fill="#111827">We agree on the scope</text>
<text x="672" y="183" font-size="13" fill="#6B7280">over a quick call</text>
</g><g class="fade" style="animation-delay:0.80s">
<circle cx="644" cy="220" r="15" fill="#ECFDF5" stroke="#A7F3D0"/>
<text x="644" y="225" text-anchor="middle" font-size="14" font-weight="800" fill="#059669">3</text>
<text x="672" y="218" font-size="15.5" font-weight="700" fill="#111827">I build it and keep you posted</text>
<text x="672" y="237" font-size="13" fill="#6B7280">with regular updates</text>
</g>
</svg>
