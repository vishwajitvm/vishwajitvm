<svg xmlns="http://www.w3.org/2000/svg" width="96" height="40" viewBox="0 0 96 40" role="img" aria-label="Astro">
<title>Astro</title>
<defs><clipPath id="pc"><rect x="1.5" y="1.5" width="93" height="37" rx="18.5"/></clipPath><linearGradient id="shg" x1="0" x2="1"><stop offset="0" stop-color="#0284C7" stop-opacity="0"/><stop offset=".5" stop-color="#0284C7" stop-opacity=".22"/><stop offset="1" stop-color="#0284C7" stop-opacity="0"/></linearGradient></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.fade{opacity:0;animation:fade .7s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(2.6);opacity:0}}
.cy{opacity:0;animation:cy 10s infinite}
@keyframes cy{0%{opacity:0;transform:translateY(10px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-10px)}}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{to{transform:scale(1)}}
.float{animation:float 7s ease-in-out infinite}
.float2{animation:float 9s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,12px)}}
</style>
<style>
.sh{transform:translateX(-80px);animation:sh 9.0s linear infinite;animation-delay:0.49s}
@keyframes sh{0%{transform:translateX(-80px)}9%,100%{transform:translateX(136px)}}
.ic{transform-box:fill-box;transform-origin:center;animation:bop 9.0s ease-in-out infinite;animation-delay:0.59s}
@keyframes bop{0%,8%,100%{transform:none}3%{transform:scale(1.3) rotate(-10deg)}}
.bd{animation:bd 9.0s ease-in-out infinite;animation-delay:0.49s}
@keyframes bd{0%,10%,100%{stroke:#BAE6FD}4%{stroke:#0284C7}}
</style>
<rect x=".75" y=".75" width="94.5" height="38.5" rx="19.25" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5" class="bd"/>
<g clip-path="url(#pc)"><g class="sh"><rect x="0" y="-10" width="46" height="60" fill="url(#shg)" transform="skewX(-20)"/></g></g>
<g class="ic"><svg x="12.0" y="10.0" width="20" height="20" viewBox="0 0 24 24"><g fill="#BC52EE"><path d="M8.358 20.162c-1.186-1.07-1.532-3.316-1.038-4.944.856 1.026 2.043 1.352 3.272 1.535 1.897.283 3.76.177 5.522-.678.202-.098.388-.229.608-.36.166.473.209.95.151 1.437-.14 1.185-.738 2.1-1.688 2.794-.38.277-.782.525-1.175.787-1.205.804-1.531 1.747-1.078 3.119l.044.148a3.158 3.158 0 0 1-1.407-1.188 3.31 3.31 0 0 1-.544-1.815c-.004-.32-.004-.642-.048-.958-.106-.769-.472-1.113-1.161-1.133-.707-.02-1.267.411-1.415 1.09-.012.053-.028.104-.045.165h.002zm-5.961-4.445s3.24-1.575 6.49-1.575l2.451-7.565c.092-.366.36-.614.662-.614.302 0 .57.248.662.614l2.45 7.565c3.85 0 6.491 1.575 6.491 1.575L16.088.727C15.93.285 15.663 0 15.303 0H8.697c-.36 0-.615.285-.784.727l-5.516 14.99z"/></g></svg></g>
<text x="41" y="25.5" font-size="14.5" font-weight="600" fill="#111827">Astro</text>
</svg>
