.ic{transform-box:fill-box;transform-origin:center;animation:bop 9.0s ease-in-out infinite;animation-delay:5.25s}
@keyframes bop{0%,8%,100%{transform:none}3%{transform:scale(1.3) rotate(-10deg)}}
.bd{animation:bd 9.0s ease-in-out infinite;animation-delay:5.15s}
@keyframes bd{0%,10%,100%{stroke:#FBCFE8}4%{stroke:#DB2777}}
</style>
<rect x=".75" y=".75" width="78.5" height="38.5" rx="19.25" fill="#FFFFFF" stroke="#FBCFE8" stroke-width="1.5" class="bd"/>
