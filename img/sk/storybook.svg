<svg xmlns="http://www.w3.org/2000/svg" width="126" height="40" viewBox="0 0 126 40" role="img" aria-label="Storybook">
<title>Storybook</title>
<defs><clipPath id="pc"><rect x="1.5" y="1.5" width="123" height="37" rx="18.5"/></clipPath><linearGradient id="shg" x1="0" x2="1"><stop offset="0" stop-color="#0284C7" stop-opacity="0"/><stop offset=".5" stop-color="#0284C7" stop-opacity=".22"/><stop offset="1" stop-color="#0284C7" stop-opacity="0"/></linearGradient></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.fade{opacity:0;animation:fade .7s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(2.6);opacity:0}}
.cy{opacity:0;animation:cy 10s infinite}
@keyframes cy{0%{opacity:0;transform:translateY(10px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-10px)}}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{to{transform:scale(1)}}
.float{animation:float 7s ease-in-out infinite}
.float2{animation:float 9s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,12px)}}
</style>
<style>
.sh{transform:translateX(-80px);animation:sh 9.0s linear infinite;animation-delay:0.98s}
@keyframes sh{0%{transform:translateX(-80px)}9%,100%{transform:translateX(166px)}}
.ic{transform-box:fill-box;transform-origin:center;animation:bop 9.0s ease-in-out infinite;animation-delay:1.08s}
@keyframes bop{0%,8%,100%{transform:none}3%{transform:scale(1.3) rotate(-10deg)}}
.bd{animation:bd 9.0s ease-in-out infinite;animation-delay:0.98s}
@keyframes bd{0%,10%,100%{stroke:#BAE6FD}4%{stroke:#0284C7}}
</style>
<rect x=".75" y=".75" width="124.5" height="38.5" rx="19.25" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5" class="bd"/>
<g clip-path="url(#pc)"><g class="sh"><rect x="0" y="-10" width="46" height="60" fill="url(#shg)" transform="skewX(-20)"/></g></g>
<g class="ic"><svg x="12.0" y="10.0" width="20" height="20" viewBox="0 0 24 24"><g fill="#FF4785"><path d="M16.71.243l-.12 2.71a.18.18 0 00.29.15l1.06-.8.9.7a.18.18 0 00.28-.14l-.1-2.76 1.33-.1a1.2 1.2 0 011.279 1.2v21.596a1.2 1.2 0 01-1.26 1.2l-16.096-.72a1.2 1.2 0 01-1.15-1.16l-.75-19.797a1.2 1.2 0 011.13-1.27L16.7.222zM13.64 9.3c0 .47 3.16.24 3.59-.08 0-3.2-1.72-4.89-4.859-4.89-3.15 0-4.899 1.72-4.899 4.29 0 4.45 5.999 4.53 5.999 6.959 0 .7-.32 1.1-1.05 1.1-.96 0-1.35-.49-1.3-2.16 0-.36-3.649-.48-3.769 0-.27 4.03 2.23 5.2 5.099 5.2 2.79 0 4.969-1.49 4.969-4.18 0-4.77-6.099-4.64-6.099-6.999 0-.97.72-1.1 1.13-1.1.45 0 1.25.07 1.19 1.87z"/></g></svg></g>
<text x="41" y="25.5" font-size="14.5" font-weight="600" fill="#111827">Storybook</text>
</svg>
