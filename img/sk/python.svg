<svg xmlns="http://www.w3.org/2000/svg" width="103" height="40" viewBox="0 0 103 40" role="img" aria-label="Python">
<title>Python</title>
<defs><clipPath id="pc"><rect x="1.5" y="1.5" width="100" height="37" rx="18.5"/></clipPath><linearGradient id="shg" x1="0" x2="1"><stop offset="0" stop-color="#4F46E5" stop-opacity="0"/><stop offset=".5" stop-color="#4F46E5" stop-opacity=".22"/><stop offset="1" stop-color="#4F46E5" stop-opacity="0"/></linearGradient></defs>
<style>
