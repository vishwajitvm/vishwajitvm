<svg xmlns="http://www.w3.org/2000/svg" width="126" height="40" viewBox="0 0 126 40" role="img" aria-label="GitLab CI">
<title>GitLab CI</title>
<defs><clipPath id="pc"><rect x="1.5" y="1.5" width="123" height="37" rx="18.5"/></clipPath><linearGradient id="shg" x1="0" x2="1"><stop offset="0" stop-color="#D97706" stop-opacity="0"/><stop offset=".5" stop-color="#D97706" stop-opacity=".22"/><stop offset="1" stop-color="#D97706" stop-opacity="0"/></linearGradient></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.fade{opacity:0;animation:fade .7s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(2.6);opacity:0}}
.cy{opacity:0;animation:cy 10s infinite}
@keyframes cy{0%{opacity:0;transform:translateY(10px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-10px)}}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{to{transform:scale(1)}}
.float{animation:float 7s ease-in-out infinite}
.float2{animation:float 9s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,12px)}}
</style>
<style>
.sh{transform:translateX(-80px);animation:sh 9.0s linear infinite;animation-delay:6.50s}
@keyframes sh{0%{transform:translateX(-80px)}9%,100%{transform:translateX(166px)}}
.ic{transform-box:fill-box;transform-origin:center;animation:bop 9.0s ease-in-out infinite;animation-delay:6.60s}
@keyframes bop{0%,8%,100%{transform:none}3%{transform:scale(1.3) rotate(-10deg)}}
.bd{animation:bd 9.0s ease-in-out infinite;animation-delay:6.50s}
@keyframes bd{0%,10%,100%{stroke:#FDE68A}4%{stroke:#D97706}}
</style>
<rect x=".75" y=".75" width="124.5" height="38.5" rx="19.25" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5" class="bd"/>
<g clip-path="url(#pc)"><g class="sh"><rect x="0" y="-10" width="46" height="60" fill="url(#shg)" transform="skewX(-20)"/></g></g>
<g class="ic"><svg x="12.0" y="10.0" width="20" height="20" viewBox="0 0 24 24"><g fill="#FC6D26"><path d="m23.6004 9.5927-.0337-.0862L20.3.9814a.851.851 0 0 0-.3362-.405.8748.8748 0 0 0-.9997.0539.8748.8748 0 0 0-.29.4399l-2.2055 6.748H7.5375l-2.2057-6.748a.8573.8573 0 0 0-.29-.4412.8748.8748 0 0 0-.9997-.0537.8585.8585 0 0 0-.3362.4049L.4332 9.5015l-.0325.0862a6.0657 6.0657 0 0 0 2.0119 7.0105l.0113.0087.03.0213 4.976 3.7264 2.462 1.8633 1.4995 1.1321a1.0085 1.0085 0 0 0 1.2197 0l1.4995-1.1321 2.4619-1.8633 5.006-3.7489.0125-.01a6.0682 6.0682 0 0 0 2.0094-7.003z"/></g></svg></g>
<text x="41" y="25.5" font-size="14.5" font-weight="600" fill="#111827">GitLab CI</text>
</svg>
