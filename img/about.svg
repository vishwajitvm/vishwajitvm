<text x="66" y="199.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">VM</text>
<rect x="92" y="164" width="562.3" height="46" rx="22" fill="#F3F4F6"/>
<text x="114" y="193" font-size="15.5" fill="#111827">Hey! 👋 I'm Vishwajit VM, a backend &amp; AI engineer from New Delhi, India.</text>
</g><g class="qin" style="animation-delay:2.45s">
<rect x="720.4" y="228" width="231.6" height="46" rx="22" fill="url(#qg)"/>
<text x="741.4" y="256.5" font-size="15.5" font-weight="600" fill="#FFFFFF">What do you actually do?</text>
</g><g class="typing" style="animation-delay:2.90s">
<rect x="92" y="284" width="74" height="42" rx="21" fill="#F3F4F6"/>
<circle cx="112" cy="305" r="4.5" fill="#9CA3AF" class="dot" style="animation-delay:0.00s"/><circle cx="129" cy="305" r="4.5" fill="#9CA3AF" class="dot" style="animation-delay:0.15s"/><circle cx="146" cy="305" r="4.5" fill="#9CA3AF" class="dot" style="animation-delay:0.30s"/>
</g>
<g class="ain" style="animation-delay:3.65s">
<circle cx="66" cy="337" r="15" fill="url(#av)"/>
<text x="66" y="341.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">VM</text>
<rect x="92" y="284" width="584.2" height="68" rx="22" fill="#F3F4F6"/>
<text x="114" y="313" font-size="15.5" fill="#111827">I build the part of apps you don't see — the servers, databases and APIs —</text><text x="114" y="335" font-size="15.5" fill="#111827">and lately, AI assistants and automations that are genuinely useful.</text>
</g><g class="qin" style="animation-delay:4.40s">
<rect x="657.2" y="370" width="294.8" height="46" rx="22" fill="url(#qg)"/>
<text x="678.2" y="398.5" font-size="15.5" font-weight="600" fill="#FFFFFF">How much experience do you have?</text>
</g><g class="typing" style="animation-delay:4.85s">
<rect x="92" y="426" width="74" height="42" rx="21" fill="#F3F4F6"/>
<circle cx="112" cy="447" r="4.5" fill="#9CA3AF" class="dot" style="animation-delay:0.00s"/><circle cx="129" cy="447" r="4.5" fill="#9CA3AF" class="dot" style="animation-delay:0.15s"/><circle cx="146" cy="447" r="4.5" fill="#9CA3AF" class="dot" style="animation-delay:0.30s"/>
</g>
<g class="ain" style="animation-delay:5.60s">
<circle cx="66" cy="479" r="15" fill="url(#av)"/>
<text x="66" y="483.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">VM</text>
<rect x="92" y="426" width="664.5" height="68" rx="22" fill="#F3F4F6"/>
<text x="114" y="455" font-size="15.5" fill="#111827">5+ years at 4 companies, 12 client products shipped, and an Outstanding</text><text x="114" y="477" font-size="15.5" fill="#111827">Performance Award in 2024. Now I run the whole backend of an EU tax platform at SPNX.</text>
</g><g class="qin" style="animation-delay:6.35s">
<rect x="791.5" y="512" width="160.5" height="46" rx="22" fill="url(#qg)"/>
<text x="812.5" y="540.5" font-size="15.5" font-weight="600" fill="#FFFFFF">Can I hire you?</text>
</g><g class="typing" style="animation-delay:6.80s">
<rect x="92" y="568" width="74" height="42" rx="21" fill="#F3F4F6"/>
<circle cx="112" cy="589" r="4.5" fill="#9CA3AF" class="dot" style="animation-delay:0.00s"/><circle cx="129" cy="589" r="4.5" fill="#9CA3AF" class="dot" style="animation-delay:0.15s"/><circle cx="146" cy="589" r="4.5" fill="#9CA3AF" class="dot" style="animation-delay:0.30s"/>
</g>
<g class="ain" style="animation-delay:7.55s">
<circle cx="66" cy="621" r="15" fill="url(#av)"/>
<text x="66" y="625.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">VM</text>
<rect x="92" y="568" width="693.7" height="68" rx="22" fill="#F3F4F6"/>
<text x="114" y="597" font-size="15.5" fill="#111827">Yes! 🙌 I'm open to freelance and contract work, fully remote.</text><text x="114" y="619" font-size="15.5" fill="#111827">Click this chat to email me, or pick any link below. I'd love to hear about your project.</text>
</g><g class="fade" style="animation-delay:8.30s">
<rect x="40" y="658" width="852" height="50" rx="25" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="66" y="689" font-size="15" fill="#6B7280">Write to me… (click anywhere on this chat to send an email)</text>
