<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="734" viewBox="0 0 1000 734" role="img" aria-label="About me, as a chat: I'm Vishwajit VM, a backend and AI engineer from New Delhi, India with 5+ years at 4 companies. I'm open to freelance and contract work.">
<title>About me, as a chat: I'm Vishwajit VM, a backend and AI engineer from New Delhi, India with 5+ years at 4 companies. I'm open to freelance and contract work.</title>
<defs><clipPath id="ac"><rect width="1000" height="734" rx="24"/></clipPath><linearGradient id="qg" x1="0" x2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#7C3AED"/></linearGradient><linearGradient id="av" x1="0" x2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#DB2777"/></linearGradient></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.fade{opacity:0;animation:fade .7s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(2.6);opacity:0}}
.cy{opacity:0;animation:cy 10s infinite}
@keyframes cy{0%{opacity:0;transform:translateY(10px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-10px)}}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{to{transform:scale(1)}}
.float{animation:float 7s ease-in-out infinite}
.float2{animation:float 9s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,12px)}}
</style>
<g clip-path="url(#ac)"><rect width="1000" height="734" fill="#FFFFFF"/><g class="float"><circle cx="990" cy="10" r="90" fill="#EEF2FF"/></g></g><rect x=".5" y=".5" width="999" height="733" rx="24" fill="none" stroke="#E5E7EB"/><style>
.qin{opacity:0;animation:qin .45s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes qin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.ain{opacity:0;animation:ain .45s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ain{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.typing{opacity:0;animation:typing .75s linear both}
@keyframes typing{0%{opacity:0}15%,85%{opacity:1}100%{opacity:0}}
.dot{animation:dot .8s ease-in-out infinite}
@keyframes dot{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style><g class="fade">
<circle cx="52" cy="42" r="23" fill="url(#av)"/>
<text x="52" y="47.5" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">VM</text>
<circle cx="69" cy="59" r="6.5" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="90" y="38" font-size="17.5" font-weight="800" fill="#111827">Vishwajit VM</text>
<text x="90" y="59" font-size="13" font-weight="600" fill="#047857">Online · open to new projects</text>
<text x="952" y="47" text-anchor="end" font-size="13" fill="#6B7280">💬 Quick chat</text>
<line x1="24" y1="84" x2="976" y2="84" stroke="#F1F5F9" stroke-width="1.5"/>
</g><g class="qin" style="animation-delay:0.50s">
<rect x="783.6" y="108" width="168.4" height="46" rx="22" fill="url(#qg)"/>
<text x="804.6" y="136.5" font-size="15.5" font-weight="600" fill="#FFFFFF">Hi! Who are you?</text>
</g><g class="typing" style="animation-delay:0.95s">
<rect x="92" y="164" width="74" height="42" rx="21" fill="#F3F4F6"/>
